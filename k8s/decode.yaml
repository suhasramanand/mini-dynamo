# Decode workers run as a StatefulSet with two replicas. Stable per-pod DNS
# (decode-0.decode, decode-1.decode) lets the router pin a session to the pod
# that already holds its KV cache, and fall back to the other pod on failure.
apiVersion: v1
kind: Service
metadata:
  name: decode
  namespace: mini-dynamo
  labels:
    app: decode
spec:
  clusterIP: None          # headless: stable per-pod DNS
  selector:
    app: decode
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: decode
  namespace: mini-dynamo
spec:
  serviceName: decode
  replicas: 2
  selector:
    matchLabels:
      app: decode
  template:
    metadata:
      labels:
        app: decode
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: decode
          image: mini-dynamo:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["main:app", "--app-dir", "services/decode", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mini-dynamo-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ROLE
              value: decode
            - name: SERVICE_NAME
              value: "$(POD_NAME)"
            - name: ADVERTISE_URL
              value: "http://$(POD_NAME).decode.mini-dynamo.svc.cluster.local:8000"
            - name: GPU_MEMORY_MB
              value: "2048"
            - name: EVICTION_POLICY
              value: lru
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
