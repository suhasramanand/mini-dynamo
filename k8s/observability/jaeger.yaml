# Jaeger all-in-one with the OTLP receiver enabled. Services export traces to
# jaeger:4317 (OTLP gRPC); the UI is on 16686.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: mini-dynamo
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: mini-dynamo
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: ui
      port: 16686
      targetPort: 16686
