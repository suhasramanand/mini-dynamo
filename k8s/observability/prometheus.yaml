# Prometheus discovers pods via the Kubernetes API and scrapes those carrying
# the prometheus.io/scrape annotation. The scrape config is supplied by the
# `prometheus-config` ConfigMap (generated by kustomize from
# observability/files/prometheus.yml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mini-dynamo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mini-dynamo-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mini-dynamo-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mini-dynamo-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mini-dynamo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mini-dynamo
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mini-dynamo
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
