apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: mini-dynamo
  labels:
    app: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: router
          image: mini-dynamo:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["main:app", "--app-dir", "services/router", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mini-dynamo-config
          env:
            - name: SERVICE_NAME
              value: router
            - name: ROLE
              value: router
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: mini-dynamo
  labels:
    app: router
spec:
  type: ClusterIP
  selector:
    app: router
  ports:
    - name: http
      port: 8000
      targetPort: 8000
